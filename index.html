<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fc">
  <title>School Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🏫</div>
        <div class="brand-name">ITI Management System<small>ប្រព័ន្ធគ្រប់គ្រងសាលា</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-bottom"><div class="school-year">CURRENT ACADEMIC YEAR<strong>2025 — 2026</strong></div></div>
    </aside>
    <button class="overlay" id="overlay" aria-label="Close navigation"></button>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-expanded="false">☰</button>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input class="search" id="global-search" type="search" placeholder="Search students, classes..." autocomplete="off" aria-label="Search students and sections">
          <div class="search-results" id="search-results" role="listbox"></div>
        </div>
        <div class="top-spacer"></div>
        <div class="top-date" id="today"></div>
        <button class="icon-button" id="language-toggle" type="button" aria-label="Switch language" title="Switch language">EN</button>
        <button class="icon-button" id="notification-button" aria-label="View notifications" title="Notifications">♧<span class="notification-dot"></span></button>
        <div class="profile">
          <div class="avatar" aria-hidden="true">SR</div>
          <div class="profile-copy"><strong>Sokha Rath</strong><small>School Administrator</small></div>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
      <footer class="footer">
        <span>© 2026 ITI Management System</span>
        <div class="footer-links"><a href="#" data-footer="Privacy policy">Privacy</a><a href="#" data-footer="Terms of service">Terms</a><a href="#" data-footer="Support">Support</a></div>
        <span class="live-status"><i class="live-dot"></i> All systems operational</span>
      </footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="student-modal" role="presentation">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head">
          <div><h2 id="modal-title">Add a student</h2><p>Enter the student's details. Personal information is saved in this browser.</p></div>
          <button class="close-button" id="close-modal" aria-label="Close dialog">×</button>
        </div>
        <form id="student-form">
          <div class="form-grid">
            <div class="field"><label for="student-name">Full name</label><input id="student-name" name="name" required maxlength="70" placeholder="e.g. Dara Sok"></div>
            <div class="field"><label for="student-gender">Gender</label><select id="student-gender" name="gender" required><option value="">Select gender</option><option>Female</option><option>Male</option><option>Other</option></select></div>
            <div class="field"><label for="student-class">Class / level</label><select id="student-class" name="className" required><option value="">Select level</option><option>Vocational</option><option>Associate Degree</option><option>Bachelor Degree</option></select></div>
            <div class="field"><label for="student-dob">Date of birth</label><input id="student-dob" name="dateOfBirth" type="date" required></div>
            <div class="field"><label for="student-place-of-birth">Place of birth</label><input id="student-place-of-birth" name="placeOfBirth" type="text" maxlength="100" placeholder="City / province" required></div>
            <div class="field"><label for="student-personal-number">Personal number</label><input id="student-personal-number" name="personalNumber" type="text" maxlength="40" autocomplete="off" placeholder="Enter personal number" required></div>
            <div class="field"><label for="student-parent-number">Parent number</label><input id="student-parent-number" name="parentNumber" type="tel" maxlength="24" autocomplete="tel" placeholder="012 345 678" required></div>
          </div>
          <div class="modal-actions"><button type="button" class="btn secondary" id="cancel-modal">Cancel</button><button type="submit" class="btn">Add student</button></div>
        </form>
      </section>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
